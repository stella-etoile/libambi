[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ambi-codec"
version = "0.0.1"
description = "AMBI: RL-learned guillotine-partition image codec (core library)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest", "scipy", "scikit-image"]
rl = ["torch"]
gui = ["PySide6"]
compare = ["matplotlib"]

[project.scripts]
ambi = "ambi_cli.main:main"

[project.gui-scripts]
ambi-gui = "ambi_gui.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
